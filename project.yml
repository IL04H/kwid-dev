name: KwidClock
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  KwidClock:
    type: application
    platform: iOS
    sources:
      - path: KwidClock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.il04h.kwidclock
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kwid Clock
        TARGETED_DEVICE_FAMILY: "1,2"
